<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="description" content="Aurora — лёгкий веб-плеер: музыка из интернета, без рекламы, без тяжёлых зависимостей.">
<title>Aurora · плеер</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237c5cff'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%230b0b12'/><path d='M9 21V11l14-3v10' stroke='url(%23g)' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='7.4' cy='21' r='2.6' fill='url(%23g)'/><circle cx='21.4' cy='18' r='2.6' fill='url(%23g)'/></svg>">
</head>
<body>

<!-- ============ animated background (transform-only, GPU composited) ============ -->
<div class="bg" aria-hidden="true">
  <div class="blob blob--a"></div>
  <div class="blob blob--b"></div>
  <div class="blob blob--c"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<!-- ============ icon sprite ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 9v9.5A1.5 1.5 0 0 0 7 20h10a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 3C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 3C19.5 15.4 12 20 12 20z" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2 19 12 8 18.8z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7.5" y="5.5" width="3.4" height="13" rx="1.3" fill="currentColor"/><rect x="13.1" y="5.5" width="3.4" height="13" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.5v13L8.5 12z" fill="currentColor"/><rect x="5.2" y="5.5" width="2.4" height="13" rx="1.1" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.5v13L15.5 12z" fill="currentColor"/><rect x="16.4" y="5.5" width="2.4" height="13" rx="1.1" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.2c1.6 0 2.4.8 3.4 2.2M20 7h-3.4M20 17h-3.2c-1.6 0-2.4-.8-3.4-2.2M4 17h3.2c1.6 0 2.4-.8 3.4-2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17.6 4.6 20.4 7l-2.8 2.4M17.6 14.6 20.4 17l-2.8 2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h9a3 3 0 0 1 3 3v1M17 17H8a3 3 0 0 1-3-3v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.4 4.6 7 7l2.4 2.4M14.6 19.4 17 17l-2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h9a3 3 0 0 1 3 3v1M17 17H8a3 3 0 0 1-3-3v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.4 4.6 7 7l2.4 2.4M14.6 19.4 17 17l-2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="14.6" font-size="7.6" font-weight="700" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif">1</text></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4z" fill="currentColor"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-vol-mute" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4z" fill="currentColor"/><path d="m15.5 9.5 5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 10.5v6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.6" cy="17.4" r="1.9" fill="currentColor"/><path d="M18 10.5l2.6-.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9.5 4.5H4.5v5M14.5 19.5h5v-5M4.5 4.5 10 10M19.5 19.5 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13.5 3 5.5 13.5H11l-.5 7.5 8-10.5H13z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V7l10-2.2v11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="15.8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.4 8.4 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.8" y="6.5" width="18.4" height="11" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.6 10h.01M10 10h.01M13.4 10h.01M16.8 10h.01M8 13.8h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-7.5 7.5M18 14.5V18a1.5 1.5 0 0 1-1.5 1.5H6.5A1.5 1.5 0 0 1 5 18V7.5A1.5 1.5 0 0 1 6.5 6H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.2 4.2 0 0 1-.6-8.4 5.6 5.6 0 0 1 10.9-1A4.4 4.4 0 0 1 17 18z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<!-- ============ shell ============ -->
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand__mark"><svg><use href="#i-note"/></svg></div>
      <div class="brand__txt">
        <strong>Aurora</strong>
        <span>плеер без рекламы</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav__item is-active" data-view="home"><svg><use href="#i-home"/></svg><span>В тренде</span></button>
      <button class="nav__item" data-view="search"><svg><use href="#i-search"/></svg><span>Поиск</span></button>
      <button class="nav__item" data-view="archive"><svg><use href="#i-archive"/></svg><span>Internet Archive</span></button>
      <button class="nav__item" data-view="soundcloud"><svg><use href="#i-cloud"/></svg><span>SoundCloud</span></button>
      <button class="nav__item" data-view="favorites"><svg><use href="#i-heart"/></svg><span>Избранное</span></button>
      <button class="nav__item" data-view="history"><svg><use href="#i-clock"/></svg><span>История</span></button>
    </nav>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__footer">
      <button class="minirow" id="btnSleep" title="Таймер сна">
        <svg><use href="#i-moon"/></svg><span>Таймер сна</span><em id="sleepLabel">выкл</em>
      </button>
      <button class="minirow" id="btnPerf" title="Отключить тяжёлые эффекты">
        <svg><use href="#i-zap"/></svg><span>Эконом-режим</span><em id="perfLabel">выкл</em>
      </button>
      <button class="minirow" id="btnKeys" title="Горячие клавиши">
        <svg><use href="#i-kbd"/></svg><span>Клавиши</span><em>?</em>
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="search">
        <svg class="search__ico"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="Искать треки и исполнителей…" autocomplete="off" spellcheck="false">
        <kbd class="search__kbd">/</kbd>
      </div>
      <div class="topbar__right">
        <span class="pill" id="statusPill" data-state="idle">готов</span>
      </div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

<!-- ============ player bar ============ -->
<footer class="player" id="player">
  <div class="player__progress" id="seekBar" role="slider" tabindex="0" aria-label="Перемотка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="player__progress-track">
      <div class="player__progress-buffer" id="bufferBar"></div>
      <div class="player__progress-fill" id="fillBar"></div>
      <div class="player__progress-knob" id="knob"></div>
    </div>
    <div class="player__seektip" id="seekTip">0:00</div>
  </div>

  <div class="player__inner">
    <div class="player__track" id="trackInfo">
      <button class="cover cover--sm" id="coverBtn" title="Развернуть">
        <img id="coverImg" alt="" decoding="async">
        <span class="cover__fallback"><svg><use href="#i-note"/></svg></span>
        <span class="cover__expand"><svg><use href="#i-expand"/></svg></span>
      </button>
      <div class="player__meta">
        <div class="player__title" id="npTitle">Ничего не играет</div>
        <div class="player__artist" id="npArtist">выберите трек из списка</div>
      </div>
      <button class="iconbtn" id="btnFav" title="В избранное"><svg><use href="#i-heart"/></svg></button>
    </div>

    <div class="player__controls">
      <button class="iconbtn" id="btnShuffle" title="Перемешать (S)"><svg><use href="#i-shuffle"/></svg></button>
      <button class="iconbtn" id="btnPrev" title="Предыдущий (P)"><svg><use href="#i-prev"/></svg></button>
      <button class="playbtn" id="btnPlay" title="Играть / пауза (Space)">
        <svg class="ico-play"><use href="#i-play"/></svg>
        <svg class="ico-pause"><use href="#i-pause"/></svg>
      </button>
      <button class="iconbtn" id="btnNext" title="Следующий (N)"><svg><use href="#i-next"/></svg></button>
      <button class="iconbtn" id="btnRepeat" title="Повтор (R)"><svg><use href="#i-repeat"/></svg></button>
    </div>

    <div class="player__right">
      <span class="time" id="tCur">0:00</span>
      <span class="time time--total" id="tDur">0:00</span>
      <canvas class="viz" id="viz" width="300" height="44" aria-hidden="true"></canvas>
      <div class="vol">
        <button class="iconbtn" id="btnMute" title="Звук (M)"><svg class="ico-vol"><use href="#i-vol"/></svg><svg class="ico-mute"><use href="#i-vol-mute"/></svg></button>
        <input id="volRange" type="range" min="0" max="100" value="80" aria-label="Громкость">
      </div>
      <button class="iconbtn" id="btnQueue" title="Очередь (Q)"><svg><use href="#i-queue"/></svg></button>
    </div>
  </div>
</footer>

<!-- ============ queue drawer ============ -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__head">
    <div>
      <strong>Очередь</strong>
      <span id="queueCount">0 треков</span>
    </div>
    <div class="drawer__actions">
      <button class="chip" id="btnClearQueue">Очистить</button>
      <button class="iconbtn" id="btnCloseDrawer" title="Закрыть"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>
  <div class="drawer__body" id="queueList"></div>
</aside>

<!-- ============ now playing overlay ============ -->
<div class="np" id="np" aria-hidden="true">
  <div class="np__bg" id="npBg"></div>
  <button class="np__close iconbtn" id="npClose" title="Свернуть (Esc)"><svg><use href="#i-close"/></svg></button>
  <div class="np__body">
    <div class="np__art">
      <div class="np__ring"><canvas id="ringViz" width="460" height="460"></canvas></div>
      <img id="npImg" alt="" decoding="async">
    </div>
    <div class="np__info">
      <span class="np__badge" id="npSource">—</span>
      <h1 id="npBigTitle">—</h1>
      <p id="npBigArtist">—</p>
      <div class="np__stats" id="npStats"></div>
      <a class="np__link" id="npLink" href="#" target="_blank" rel="noopener noreferrer">
        <svg><use href="#i-external"/></svg><span>Источник</span>
      </a>
    </div>
  </div>
</div>

<!-- ============ shortcuts modal ============ -->
<div class="modal" id="keysModal" aria-hidden="true">
  <div class="modal__card">
    <div class="modal__head">
      <strong>Горячие клавиши</strong>
      <button class="iconbtn" id="keysClose"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="modal__body" id="keysBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/sources.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
